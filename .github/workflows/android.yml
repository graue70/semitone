name: android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: resolve ffmpeg submodule commit
        id: ffmpeg
        run: echo "sha=$(git rev-parse HEAD:lib/ffmpeg)" >> "$GITHUB_OUTPUT"

      - name: cache ffmpeg build output
        id: cache
        uses: actions/cache@v6
        with:
          path: lib/ffmpeg/build
          key: ffmpeg-build-${{ steps.ffmpeg.outputs.sha }}-${{ hashFiles('tools/build_ffmpeg.sh') }}

      - name: init submodules
        run: |
          git submodule update --init lib/oboe
          if [ "${{ steps.cache.outputs.cache-hit }}" != 'true' ]; then
            git submodule update --init lib/ffmpeg
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: accept android sdk licenses
        run: |
          sdkmanager="$(command -v sdkmanager ||
            echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          yes | "$sdkmanager" --licenses > /dev/null

      - name: install ndk and cmake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.31.1"

      - name: build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          ./tools/build_ffmpeg.sh
          ./tools/copy_ffmpeg.sh

      - name: prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo >&2 "secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS must be set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF

      - name: build apk
        id: apk
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            vname="1.3.2-test.${GITHUB_RUN_NUMBER}"
            vcode=$((6 + GITHUB_RUN_NUMBER))
            ./gradlew assembleRelease "-PciVersionName=$vname" "-PciVersionCode=$vcode"
          else
            vname="${GITHUB_REF_NAME#v}"
            ./gradlew assembleRelease
          fi
          echo "version=$vname" >> "$GITHUB_OUTPUT"

      - name: rename apk
        run: |
          ls build/outputs/apk/release/
          mv build/outputs/apk/release/*.apk "semitone-${{ steps.apk.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: semitone-apk
          path: semitone-*.apk

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            prev="$(git tag --sort=-creatordate | head -1)"
            branch="${{ github.ref_name }}"
            sha="${{ github.sha }}"
            {
              echo "branch: $branch, commit: $sha"
              if [ -n "$prev" ]; then
                log="$(git log --no-merges --reverse \
                  --format="* [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" \
                  "$prev..$sha")"
                echo
                echo "## Commits since $prev"
                if [ -n "$log" ]; then
                  echo "$log"
                else
                  echo "* (no new commits)"
                fi
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$VERSION"
              fi
            } > notes.md
            gh release create "$VERSION" "semitone-$VERSION.apk" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "test build $VERSION ($branch)" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "semitone-$VERSION.apk" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
