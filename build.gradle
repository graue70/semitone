plugins {
    id 'com.android.application' version '9.4.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
}

android {
    namespace = 'mn.tck.semitone'
    compileSdk 36
    ndkVersion = '28.2.13676358'

    lint {
        disable "GoogleAppIndexingWarning"
    }

    defaultConfig {
        applicationId "io.github.graue70.semitone"
        minSdk 23
        targetSdk 36
        // versionCode scheme: M * 10^6 + m * 10^4 + p * 10^2 + prerelease,
        // where prerelease is the test build number (< 95) or 95 for stable
        // releases; e.g. 1.4.0-test.9 -> 1040009, 1.4.0 -> 1040095. CI derives
        // versionCode and versionName from the git tag or the test build
        // number and passes them via the ciVersion* properties; the values
        // below are only used for local builds and should be kept in sync
        // with the upcoming release.
        versionCode (project.hasProperty('ciVersionCode') ? project.property('ciVersionCode').toInteger() : 1040095)
        versionName (project.hasProperty('ciVersionName') ? project.property('ciVersionName') : '1.4.0')
    }

    signingConfigs {
        config {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.config
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.36.1').aosp()
        removeUnusedImports()
    }
}
